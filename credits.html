<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillSwap — Credits (Phase 6)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{trust:'#2563EB',amber2:'#F59E0B',ink:'#0F172A',muted:'#F8FAFC'},borderRadius:{card:'12px'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-muted text-ink">
<header class="bg-white shadow-sm"><div class="max-w-3xl mx-auto px-4 py-3 flex justify-between">
<a href="index.html" class="font-bold">🔄 SkillSwap</a>
<nav class="flex gap-3 text-sm"><a href="index.html">Home</a><a href="exchange.html">Exchanges</a><a href="profile.html">Profile</a></nav>
</div></header>
<main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
<h1 class="text-xl font-semibold">🪙 Skill Credits: <span id="bal">14</span></h1>
<p class="text-sm text-gray-500">1 hour taught = +1 · 1 hour learned = −1 · Direct swaps use 0 credits. Prototype ledger saves in browser (immutable server ledger in backend build).</p>
<div class="bg-white rounded-card shadow p-4 text-sm space-y-2">
<p class="font-medium">Simulate an exchange</p>
<div class="flex flex-wrap gap-2">
<button id="bTeach" class="bg-trust text-white px-4 py-2 rounded-full">Teach 1h (+1)</button>
<button id="bLearn" class="bg-gray-100 px-4 py-2 rounded-full">Learn 1h (−1)</button>
<button id="bDirect" class="bg-gray-100 px-4 py-2 rounded-full">Direct swap (0)</button>
<button id="bReset" class="text-red-600 px-4 py-2 text-sm">Reset demo</button>
</div>
<p id="msg" class="text-sm text-red-600"></p>
</div>
<div class="bg-white rounded-card shadow p-4 text-sm space-y-1">
<p class="font-medium">Ledger</p>
<div id="ledger" class="space-y-1"></div>
</div>
</main>
<script>
let bal=parseInt(localStorage.getItem('ss_bal')||'14',10);
let rows=JSON.parse(localStorage.getItem('ss_ledger')||'[{"t":"+2 — Taught Excel (2h)","d":"Sep 20"},{"t":"−1 — Learned Photography (1h)","d":"Sep 22"},{"t":"+1 — Taught Sales (1h)","d":"Sep 25"}]');
function render(){
  document.getElementById('bal').textContent=bal;
  document.getElementById('ledger').innerHTML=rows.map(r=>`<p>${r.t} <span class="text-gray-500">${r.d||''}</span></p>`).join('');
  localStorage.setItem('ss_bal',bal); localStorage.setItem('ss_ledger',JSON.stringify(rows));
}
document.getElementById('bTeach').onclick=()=>{bal+=1;rows.unshift({t:'+1 — Taught (1h)',d:'just now'});document.getElementById('msg').textContent='';render();};
document.getElementById('bLearn').onclick=()=>{
  if(bal<1){document.getElementById('msg').textContent='Blocked: insufficient credits for a credit swap. Earn by teaching or use Direct swap.';return;}
  bal-=1;rows.unshift({t:'−1 — Learned (1h)',d:'just now'});document.getElementById('msg').textContent='';render();};
document.getElementById('bDirect').onclick=()=>{rows.unshift({t:'0 — Direct swap Skill ↔ Skill (no credits)',d:'just now'});document.getElementById('msg').textContent='';render();};
document.getElementById('bReset').onclick=()=>{bal=14;rows=[{"t":"+2 — Taught Excel (2h)","d":"Sep 20"},{"t":"−1 — Learned Photography (1h)","d":"Sep 22"},{"t":"+1 — Taught Sales (1h)","d":"Sep 25"}];document.getElementById('msg').textContent='';render();};
render();
</script>
</body>
</html>
