<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillSwap — My Exchanges (Phase 5)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{trust:'#2563EB',teal2:'#0D9488',ink:'#0F172A',muted:'#F8FAFC'},borderRadius:{card:'12px'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif}.step.on{background:#2563EB;color:#fff}</style>
</head>
<body class="bg-muted text-ink">
<header class="bg-white shadow-sm"><div class="max-w-3xl mx-auto px-4 py-3 flex justify-between">
<a href="index.html" class="font-bold">🔄 SkillSwap</a>
<nav class="flex gap-3 text-sm"><a href="matching.html">Matches</a><a href="request.html">Request</a><a href="chat.html">Chat</a><a href="schedule.html">Schedule</a></nav>
</div></header>
<main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
<h1 class="text-xl font-semibold">My exchange with David</h1>
<div class="bg-white rounded-card shadow p-4">
<div class="flex flex-wrap gap-2 text-xs" id="timeline"></div>
<p id="status" class="text-sm mt-3"></p>
<div class="flex flex-wrap gap-2 mt-3 text-sm">
<button id="bAccept" class="bg-trust text-white px-4 py-2 rounded-full">Accept request</button>
<button id="bSchedule" class="bg-gray-100 px-4 py-2 rounded-full">Mark scheduled</button>
<button id="bComplete" class="bg-gray-100 px-4 py-2 rounded-full">Mark exchanged</button>
<button id="bReset" class="text-red-600 px-4 py-2 text-sm">Reset demo</button>
</div>
</div>
<div class="bg-white rounded-card shadow p-4 text-sm space-y-1">
<p class="font-medium">Flow shortcuts</p>
<p><a class="text-trust" href="request.html">1. Request →</a> send Direct swap (Sales ↔ Photography, 0 credits)</p>
<p><a class="text-trust" href="chat.html">2. Chat →</a> agree (Convex realtime in backend build)</p>
<p><a class="text-trust" href="schedule.html">3. Schedule →</a> Fri 5pm Online</p>
<p><a class="text-trust" href="credits.html">4. Credits settle on complete →</a></p>
</div>
</main>
<script>
const STEPS=['Discover','Request','Chat','Agree','Schedule','Exchange','Review'];
let st=localStorage.getItem('ss_xstatus')||'Request';
function render(){
  document.getElementById('timeline').innerHTML=STEPS.map(s=>{
    const done=STEPS.indexOf(s)<=STEPS.indexOf(st);
    return `<span class="step px-3 py-1 rounded-full ${done?'on':'bg-gray-100'}">${done?'✓ ':''}${s}</span>`;
  }).join('');
  document.getElementById('status').textContent='Status: '+st+' (prototype — server state machine + Convex chat in Next.js build)';
}
document.getElementById('bAccept').onclick=()=>{st='Agree';save();};
document.getElementById('bSchedule').onclick=()=>{st='Schedule';save();};
document.getElementById('bComplete').onclick=()=>{st='Exchange';localStorage.setItem('ss_xstatus','Exchange');save();alert('Exchanged! Credits settle in Phase 6.');};
document.getElementById('bReset').onclick=()=>{st='Request';save();};
function save(){localStorage.setItem('ss_xstatus',st);render();}
render();
</script>
</body>
</html>
